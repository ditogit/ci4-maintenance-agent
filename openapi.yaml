openapi: 3.0.3
info:
  title: CI4 Maintenance Agent
  version: 1.1.0
  description: Lightweight, secure REST API for CI4 Project Hub
servers:
  - url: https://example.ac.id/api/v1/maintenance
security:
  - HMAC: []
components:
  securitySchemes:
    HMAC:
      type: apiKey
      in: header
      name: X-Maintenance-Signature
      description: HMAC-SHA256(timestamp+nonce+METHOD+path+body, secret) + X-Maintenance-Key, X-Maintenance-Timestamp, X-Maintenance-Nonce
  schemas:
    Success:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { type: object }
        request_id: { type: string, example: mnt_abc123 }
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: UNAUTHORIZED }
            message: { type: string }
        request_id: { type: string }
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        200: { description: Healthy, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        401: { description: Unauthorized }
        503: { description: Agent disabled }
  /info:
    get:
      summary: Application info
      responses:
        200: { description: Info }
        401: { description: Unauthorized }
  /session/stats:
    get:
      summary: Session statistics
      responses:
        200: { description: Stats }
        403: { description: Feature disabled }
  /session/cleanup:
    post:
      summary: Cleanup expired sessions (batch, locked)
      requestBody: { content: { application/json: { schema: { type: object, properties: { mode: { type: string, enum: [expired], example: expired } } } } } }
      responses:
        200: { description: Cleaned }
        409: { description: Already in progress }
        429: { description: Rate limited }
  /session/clear:
    post:
      summary: Clear all sessions (dangerous, disabled by default)
      responses:
        200: { description: Cleared }
        403: { description: Feature disabled }
  /database:
    get:
      summary: Database stats
      responses:
        200: { description: DB stats }
  /storage:
    get:
      summary: Storage stats
      responses:
        200: { description: Storage stats }
  /cache/clear:
    post:
      summary: Clear cache
      requestBody: { content: { application/json: { schema: { type: object, properties: { type: { type: string, enum: [all, file, config, route], example: all } } } } } }
      responses:
        200: { description: Cache cleared }
        403: { description: Feature disabled }
        409: { description: Already in progress }
  /logs:
    get:
      summary: Tail logs
      parameters:
        - { name: channel, in: query, schema: { type: string, enum: [all, error, security] }, required: false }
        - { name: limit, in: query, schema: { type: integer, default: 100 }, required: false }
      responses:
        200: { description: Logs }
        403: { description: Feature disabled }
  /logs/clear:
    post:
      summary: Clear logs (confirm=CLEAR LOGS)
      requestBody: { content: { application/json: { schema: { type: object, properties: { confirm: { type: string, example: CLEAR LOGS } } } } } }
      responses:
        200: { description: Logs cleared }
        403: { description: Feature disabled }
        422: { description: Confirmation required }
  /backup:
    post:
      summary: Create database backup
      responses:
        200: { description: Backup created, content: { application/json: { schema: { type: object, properties: { file: { type: string }, size_mb: { type: number }, duration_ms: { type: integer } } } } } }
        403: { description: Feature disabled }
  /queue:
    get:
      summary: Queue stats
      responses:
        200: { description: Queue stats }
  /queue/retry:
    post:
      summary: Retry failed queue jobs
      responses:
        200: { description: Retried }
  /queue/clear:
    post:
      summary: Clear failed queue jobs
      responses:
        200: { description: Cleared }
